[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-f"
version = "0.1.0"
description = "Reproducible experiments for the 2026 Huawei Cup Problem F"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
nonlinear = ["xgboost>=2.1,<4"]
bayes = ["pymc>=5.16,<6", "arviz>=0.19,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]
all = [
  "xgboost>=2.1,<4",
  "pymc>=5.16,<6",
  "arviz>=0.19,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
